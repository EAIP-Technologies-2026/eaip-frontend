services:
  dev:
    build:
      context: .
      target: deps
    ports:
      - "3000:3000"
      - "6006:6006"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    command: pnpm --filter enterprise-console dev
    stdin_open: true
    tty: true
